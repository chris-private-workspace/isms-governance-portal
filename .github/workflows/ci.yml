# CI — 專案 gate
#
# 設計決策 1：**不使用 paths filter。**
#
# Why: 有 paths filter 時，docs-only PR 不會觸發被過濾的 job → required status
# check 從未回報 → PR 永遠卡在 BLOCKED。這在原專案造成過反覆的手動繞道。
# 代價是 docs-only PR 多跑 1-2 分鐘 CI —— 對單人 / 小團隊完全可接受。
#
# 若你的 PR 量大到這個代價無法忍受，正確做法是把 required check 設成
# 能正確處理 skip 的 job，而不是加回 paths filter。
#
# 設計決策 2（CH-006）：**未就緒的步驟用「存在性 guard + 真實指令」，不用佔位符。**
#
# Why: 指令形狀已由 ADR-0001 定案（NestJS monorepo），所以現在就寫得出真指令 ——
# 差別只在 monorepo 骨架（W01 M0）還沒建立。用 `[ ! -f package.json ]` 守著，
# **骨架出現的那一刻 CI 自動開始檢查，不需要有人記得回來改這個檔**。
#
# 留佔位符（即使加 guard）或註解掉步驟，都會產生一個「骨架好了要回來填」的待辦，
# 而沒有任何東西會叫。那正是 CH-006 要修的問題本身。
#
# 設計決策 3（CH-006）：**架構 lint 排第一。**
#
# 它是本 repo 目前唯一不依賴技術棧的有效 gate。CH-006 之前它排第 5，
# 被前面四個未填步驟擋住，從專案第一個 PR 起就從未在 CI 執行過。
#
# Modification History:
#   - 2026-08-07: Repair unfilled placeholders + reorder so run_all runs first (CH-006)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **全歷史，不可淺 clone。** `check_sha_anchors.py`（CH-036）要回答的是
          # 「這個被文件引用的 commit 還在 main 的歷史上嗎」—— 淺 clone 下
          # `origin/main` 不存在、歷史被截斷，那個問題結構上答不出來。
          # ⚠️ 同一個 job 裡其餘的 lint 不需要它；這一行是為 sha-anchors 加的。
          # 該 detector 在看不到 origin/main 時**硬失敗而不是 skip** —— 一個
          # 安靜跳過的 detector 讀起來與通過一模一樣（AD-NegativeGate-1）。
          fetch-depth: 0

      # === 現在就有效的 gate ==========================================
      # 這一步會擋住 always-loaded 規則檔的膨脹、斷掉的文件連結、
      # 失效的路徑引用、pre-doc 的 status 漂移、mockup 保真度。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `--verbose` 是刻意的，不是除錯殘留：run_all.py 的摘要只保留每個 detector
      # 輸出的**最後一行**（run_all.py:80），而失敗時最後一行是提示語
      # （"(intentional? add …)"），真正的違規清單在它前面。沒有 --verbose 的
      # CI 失敗訊息無法診斷 —— CH-006 第一次跑就撞到，花了數步偵查才定位。
      - name: Architecture lints
        run: python scripts/lint/run_all.py --verbose

      # === workflow 自身的 lint（CH-007）================================
      # 為什麼需要：CH-006 的 bug 是 `run:` 直接執行未填佔位符，而**沒有任何東西
      # 會抓**——它只在 CI 紅了 12 次之後才被人發現。actionlint 內含 shellcheck，
      # 對那個 bug 回報 SC1072/SC1073，並且覆蓋一整類我們還沒踩到的問題
      # （過時 action、錯誤的 context 表達式、matrix 設定錯誤）。
      #
      # 釘版本 + 校驗 SHA256：在 CI 下載並執行二進位而不驗簽，等於自己開一條
      # 供應鏈缺口（guardrail 7）。做法照 security-scan.yml 的 gitleaks/trivy 前例。
      #
      # 用官方 release 而非第三方 action：每個 action 都是一條供應鏈路徑。
      - name: 安裝 actionlint（釘版本 + 校驗）
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$tarball" "${base}/${tarball}"
          curl -sSLo actionlint_checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          # 只驗我們下載的那個檔；checksums.txt 含全平台，直接跑會因缺檔而失敗。
          grep " ${tarball}\$" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Workflow lint
        run: |
          # ⚠️ 這段註解不可以用 "# shellcheck" 起頭 —— 那是 shellcheck 的 directive
          # 語法（如 disable=SC2086），它會嘗試解析後面的中文並回報 SC1072/SC1073。
          # 這個坑是 actionlint 導入的當下抓到的（CH-007）。
          #
          # ubuntu-latest 預裝 shellcheck；缺了的話 actionlint 會靜靜跳過 shell
          # 檢查——那正是 CH-006 那個 bug 所在的層，所以明確驗證它存在。
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck absent — actionlint would silently skip shell checks"
            exit 1
          }
          ./actionlint -color

      # Detector 自己也是 code（lint-detector-authoring.md:199）。直接跑檔案而不用
      # `unittest discover`：discover 要求 start dir 可 import，而 scripts/ 刻意
      # 不是 package。這個迴圈讓新增的測試檔自動被納入，不必回來改 CI。
      - name: Lint detector tests
        run: |
          n=0
          for t in scripts/lint/tests/test_*.py; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            python "$t" || exit 1
            echo "::endgroup::"
            n=$((n + 1))
          done
          echo "::notice::$n detector test file(s) run"

      # === 以下在 monorepo 骨架（W01 M0）建立前自動略過 =================
      # 指令由 ADR-0001 定案。骨架一出現就自動生效。
      #
      # ⚠️ W01 補上的缺口：原本這裡只有存在性 guard，**沒有人負責裝相依**。
      #    骨架落地後 Format check 第一次真的執行，立刻 `prettier: not found`
      #    (exit 127)。那個缺口在骨架之前不可能暴露 —— 那五步從未跑過。
      #    這正是「解封 ≠ 完成」：guard 解除只代表命令會被執行，不代表會成功。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::monorepo scaffold absent — skipped until W01 M0 (ADR-0001)"
            exit 0
          fi
          # `npm ci` 而非 `npm install`：CI 要的是照 lockfile 重現，不是解算。
          # apps/api 的 postinstall 會跑 `prisma generate` —— 生成的 client 不進
          # 版控，而 type-check / build 需要它存在。
          npm ci

      - name: Format check
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::monorepo scaffold absent — skipped until W01 M0 (ADR-0001)"
            exit 0
          fi
          npm run format:check -w apps/api -w apps/web

      # ⚠️ 絕不加 --silent —— 它會連錯誤輸出一起吞掉
      - name: Lint
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::monorepo scaffold absent — skipped until W01 M0 (ADR-0001)"
            exit 0
          fi
          npm run lint -w apps/api -w apps/web

      # A separate step on purpose: this one exists precisely for the case where
      # every other gate is green, so burying it inside Lint would hide the one
      # signal it carries. On failure the job summary names it directly.
      #
      # It runs a deliberately illegal import past eslint-plugin-boundaries and
      # requires the rule to reject it BY NAME. W01 shipped a boundaries config
      # that was valid, linted green, and enforced nothing — six separate ways.
      - name: Negative gates
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::monorepo scaffold absent — skipped until W01 M0 (ADR-0001)"
            exit 0
          fi
          npm run lint:negative

      - name: Type check
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::monorepo scaffold absent — skipped until W01 M0 (ADR-0001)"
            exit 0
          fi
          npm run type-check -w apps/api -w apps/web

      - name: Tests
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::monorepo scaffold absent — skipped until W01 M0 (ADR-0001)"
            exit 0
          fi
          # test:cov, not test — CLAUDE.md 約束 5 sets a >=80% floor, and until
          # W01 Day 3 nothing ran it: coverage sat at 45% through a green CI.
          # A threshold no job executes is a comment, not a gate.
          npm run test:cov -w apps/api
          # apps/web still runs plain `test`: vitest coverage needs
          # @vitest/coverage-v8, and page.tsx has no component test yet, so
          # enabling it today would only add a threshold set low enough to pass.
          # Tracked as AD-WebCoverage-1 rather than left silent.
          npm run test -w apps/web

      - name: Build
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::monorepo scaffold absent — skipped until W01 M0 (ADR-0001)"
            exit 0
          fi
          npm run build -w apps/api -w apps/web

      # === Integration tests (W02) ======================================
      # Started through docker/compose.yml rather than a `services:` block,
      # and the reason is not convenience. The restricted app role is created
      # by docker/init-app-role.sh, which compose runs on a fresh volume — on
      # a runner, every time. A `services:` block would need that bootstrap
      # written a second time in YAML, and then "how the app role is made"
      # would have two implementations that drift apart (AP-6). One compose
      # file serves local dev, image-smoke.yml and this job.
      #
      # ⚠️ These tests are the only thing standing between a broken RLS policy
      # and a green build. Verified by neutering the policy to USING(true) on
      # 2026-08-09: 14 of 20 turned red, and back to 20/20 on restore. Without
      # this step that check only happens when someone remembers to run it.
      # No existence guard on purpose. A step that skips when docker/compose.yml
      # is missing is the trivy job W01 shipped green while scanning zero
      # targets (image-smoke.yml:84-86). If the compose file disappears, the
      # isolation tests must go red, not quiet.
      - name: 啟動 PostgreSQL
        run: docker compose -f docker/compose.yml up -d --wait

      - name: Integration tests
        run: |
          # jest.int.config.js rebuilds isms_test from nothing, which also makes
          # this the only place `prisma migrate deploy` runs against a clean
          # database — the same gap CH-013 found in "the Dockerfile is never
          # built". Its global setup refuses to continue if the connecting role
          # is a superuser, because RLS does not apply to one and every
          # assertion would pass while proving nothing.
          #
          # Copying .env.example also keeps it honest: if those values stop
          # working against the compose file, this step says so.
          [ -f .env ] || cp .env.example .env
          npm run test:int -w apps/api

      - name: PostgreSQL 日誌
        if: always()
        run: docker compose -f docker/compose.yml logs --no-color || true
