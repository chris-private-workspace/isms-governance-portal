<!-- ============ SWITCH ENTITY ROLE ============ -->
      <sc-if value="{{ isSwitchRole }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Switch entity role">
      <div style="margin-bottom:16px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text-3);text-transform:uppercase;margin-bottom:6px;">Switch entity role</div>
        <h1 style="margin:0;font-size:23px;font-weight:700;letter-spacing:-.3px;">Switch entity role</h1>
        <div style="margin-top:5px;font-size:12.5px;color:var(--text-2);">Change the entity you are acting for. Your permissions and scope adjust to the selected role.</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:620px;">
        <sc-for list="{{ roleOptions }}" as="ro" hint-placeholder-count="7">
          <button onClick="{{ ro.onSelect }}" style="display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;border:1.5px solid {{ ro.border }};border-radius:11px;background:{{ ro.btnBg }};font-family:inherit;cursor:pointer;text-align:left;" style-hover="background:var(--surface-3);">
            <span style="width:30px;height:22px;border-radius:5px;background:var(--surface-3);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono);color:var(--text-2);flex-shrink:0;">{{ ro.flag }}</span>
            <div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:700;color:var(--text);">{{ ro.name }}</div><div style="font-size:11.5px;color:var(--text-3);">{{ ro.sub }}</div></div>
            <span style="font-size:11px;font-weight:700;color:{{ ro.chipInk }};background:{{ ro.chipBg }};border-radius:20px;padding:4px 12px;flex-shrink:0;">{{ ro.chip }}</span>
          </button>
        </sc-for>
      </div>
      </div>
      </sc-if>

    </main>
  </div>
