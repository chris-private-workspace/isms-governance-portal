  Fragment: POLICIES
  Source: design/ISMS Governance Platform.dc.html
  Template syntax: {{ value }} holes, <sc-if>, <sc-for> — see fragments/README.md

<!-- ============ POLICIES ============ -->
      <sc-if value="{{ isPolicyList }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Policies">
      <div style="margin-bottom:16px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text-3);text-transform:uppercase;margin-bottom:6px;">Policy library</div>
        <h1 style="margin:0;font-size:23px;font-weight:700;letter-spacing:-.3px;">Policies</h1>
        <div style="margin-top:5px;font-size:12.5px;color:var(--text-2);">{{ policyCount }} policies · {{ policyReview }} under review · group-wide</div>
      </div>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;">
        <button style="height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;cursor:pointer;" style-hover="background:var(--surface-3);">Category <span style="font-size:9px;color:var(--text-3);">▼</span></button>
        <button style="height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;cursor:pointer;" style-hover="background:var(--surface-3);">Status <span style="font-size:9px;color:var(--text-3);">▼</span></button>
        <div style="flex:1;"></div>
        <button style="height:34px;padding:0 14px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New policy</button>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;min-width:960px;">
            <thead><tr style="background:var(--surface-2);">
              <th style="text-align:left;padding:10px 16px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Policy</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Category</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Owner</th>
              <th style="text-align:center;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Version</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Status</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Next review</th>
              <th style="text-align:left;padding:10px 16px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Attestation</th>
            </tr></thead>
            <tbody>
              <sc-for list="{{ policiesView }}" as="p" hint-placeholder-count="9">
                <tr onClick="{{ p.onOpen }}" style="border-bottom:1px solid var(--border);cursor:pointer;" style-hover="background:var(--surface-2);">
                  <td style="padding:var(--row-py) 16px;"><div style="font-size:10.5px;font-family:var(--mono);color:var(--primary-ink);font-weight:600;">{{ p.id }}</div><div style="font-size:13px;font-weight:600;color:var(--text);">{{ p.name }}</div></td>
                  <td style="padding:var(--row-py) 12px;font-size:12.5px;color:var(--text-2);">{{ p.category }}</td>
                  <td style="padding:var(--row-py) 12px;font-size:12.5px;color:var(--text-2);">{{ p.owner }}</td>
                  <td style="text-align:center;padding:var(--row-py) 12px;font-family:var(--mono);font-size:12px;color:var(--text-2);">{{ p.version }}</td>
                  <td style="padding:var(--row-py) 12px;"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:{{ p.stBg }};"><span style="width:6px;height:6px;border-radius:50%;background:{{ p.stDot }};"></span><span style="font-size:11px;font-weight:600;color:{{ p.stInk }};">{{ p.status }}</span></span></td>
                  <td style="padding:var(--row-py) 12px;font-size:12px;color:var(--text-3);font-family:var(--mono);">{{ p.nextReview }}</td>
                  <td style="padding:var(--row-py) 16px;"><div style="display:flex;align-items:center;gap:9px;"><div style="width:56px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;"><div style="height:100%;width:{{ p.attW }};background:{{ p.attDot }};border-radius:3px;"></div></div><span style="font-size:12px;font-family:var(--mono);font-weight:600;color:var(--text-2);">{{ p.att }}</span></div></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </div>
      </div>
      </sc-if>
