<!--
  Fragment: ISSUES
  Source: design/ISMS Governance Platform.dc.html
  Template syntax: {{ value }} holes, <sc-if>, <sc-for> — see fragments/README.md
-->
<!-- ============ ISSUES ============ -->
      <sc-if value="{{ isIssueList }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Issues">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px;flex-wrap:wrap;">
        <div>
          <div style="font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text-3);text-transform:uppercase;margin-bottom:6px;">Issues & actions</div>
          <h1 style="margin:0;font-size:23px;font-weight:700;letter-spacing:-.3px;">Issues</h1>
          <div style="margin-top:5px;font-size:12.5px;color:var(--text-2);">{{ issueOpen }} open · {{ issueOverdue }} overdue · {{ scopeLabel }}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;">
        <button style="height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;cursor:pointer;" style-hover="background:var(--surface-3);">Severity <span style="font-size:9px;color:var(--text-3);">▼</span></button>
        <button style="height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;cursor:pointer;" style-hover="background:var(--surface-3);">Status <span style="font-size:9px;color:var(--text-3);">▼</span></button>
        <button style="height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;cursor:pointer;" style-hover="background:var(--surface-3);">Source <span style="font-size:9px;color:var(--text-3);">▼</span></button>
        <div style="flex:1;"></div>
        <button style="height:34px;padding:0 14px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Log issue</button>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;min-width:1000px;">
            <thead><tr style="background:var(--surface-2);">
              <th style="text-align:left;padding:10px 16px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Issue</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Severity</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Source</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Entity</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Owner</th>
              <th style="text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Due</th>
              <th style="text-align:left;padding:10px 16px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);">Status</th>
            </tr></thead>
            <tbody>
              <sc-for list="{{ issuesView }}" as="i" hint-placeholder-count="10">
                <tr onClick="{{ i.onOpen }}" style="border-bottom:1px solid var(--border);cursor:pointer;" style-hover="background:var(--surface-2);">
                  <td style="padding:var(--row-py) 16px;"><div style="font-size:10.5px;font-family:var(--mono);color:var(--primary-ink);font-weight:600;">{{ i.id }}</div><div style="font-size:13px;font-weight:600;color:var(--text);line-height:1.3;">{{ i.title }}</div></td>
                  <td style="padding:var(--row-py) 12px;"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;background:{{ i.sevBg }};"><span style="font-size:11px;font-weight:700;color:{{ i.sevInk }};">{{ i.severity }}</span></span></td>
                  <td style="padding:var(--row-py) 12px;font-size:12.5px;color:var(--text-2);">{{ i.source }}</td>
                  <td style="padding:var(--row-py) 12px;"><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:24px;height:18px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--mono);color:var(--text-2);">{{ i.flag }}</span><span style="font-size:12px;color:var(--text-2);">{{ i.entity }}</span></span></td>
                  <td style="padding:var(--row-py) 12px;font-size:12.5px;color:var(--text-2);">{{ i.owner }}</td>
                  <td style="padding:var(--row-py) 12px;font-size:12px;color:var(--text-3);font-family:var(--mono);">{{ i.due }}</td>
                  <td style="padding:var(--row-py) 16px;"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:{{ i.stBg }};"><span style="width:6px;height:6px;border-radius:50%;background:{{ i.stDot }};"></span><span style="font-size:11px;font-weight:600;color:{{ i.stInk }};">{{ i.status }}</span></span></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </div>
      </div>
      </sc-if>
